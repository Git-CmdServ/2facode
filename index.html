<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2FA Authenticator</title>
<style>:root{--bg:#f5f6f8;--card:#fff;--text:#121316;--muted:#8b9099;--line:#e8eaee;--soft:#f8f9fb;--red:#ef4444}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{width:min(720px,100%);margin:auto}.brand{display:flex;align-items:center;gap:12px;margin:0 0 16px 4px}.logo{width:42px;height:42px;border-radius:13px;background:#111;color:#fff;display:grid;place-items:center}.logo svg{width:22px}.brand-copy b{display:block}.brand-copy span{font-size:12px;color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:26px;overflow:hidden;box-shadow:0 24px 70px rgba(16,24,40,.08)}.top{padding:28px}h1{font-size:30px;margin:0 0 8px}.desc{margin:0;color:var(--muted);font-size:14px;line-height:1.55}.form{display:grid;grid-template-columns:1fr 1.6fr auto;gap:8px;margin-top:22px}.field{border:1px solid var(--line);border-radius:14px;background:var(--soft);padding:0 12px;height:48px;outline:none;font-weight:600}.secret{font-family:monospace}.add{height:48px;border:0;border-radius:14px;background:#111;color:#fff;padding:0 18px;font-weight:750;cursor:pointer}.status{min-height:18px;margin-top:10px;font-size:12px;color:var(--muted)}.status.error{color:var(--red)}.list{padding:0 28px 28px}.empty{padding:34px 16px;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:13px}.account{border-top:1px solid var(--line);padding:22px 0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center}.account-name{font-size:14px;font-weight:800}.account-meta{font-size:11px;color:var(--muted);margin-top:4px}.code{font-size:clamp(30px,7vw,44px);font-weight:850;letter-spacing:.12em;margin-top:12px;font-variant-numeric:tabular-nums}.timer{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11px;margin-top:9px}.bar{height:5px;background:#eceef2;border-radius:999px;overflow:hidden;flex:1;max-width:220px}.bar i{display:block;height:100%;background:#111;border-radius:inherit}.actions{display:flex;gap:7px}.icon-btn{width:42px;height:42px;border:1px solid var(--line);border-radius:13px;background:#fff;display:grid;place-items:center;cursor:pointer}.icon-btn svg{width:19px;stroke:currentColor;fill:none;stroke-width:1.8}.footer{padding:15px 20px;border-top:1px solid var(--line);color:#8a8f97;font-size:11px;background:#fafbfc}.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);background:#151619;color:#fff;padding:10px 14px;border-radius:12px;font-size:12px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:620px){body{padding:14px}.form{grid-template-columns:1fr}.account{grid-template-columns:1fr}}</style></head>
<body><div class="shell"><div class="brand"><div class="logo"><svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v2.5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></div><div class="brand-copy"><b>2FA Authenticator</b><span>Локальный TOTP-генератор</span></div></div><main class="card"><section class="top"><h1>Мои коды</h1><p class="desc">Добавляй Base32-секреты или ссылки <b>otpauth://</b>. Коды обновляются автоматически каждые 30 секунд или по периоду, указанному сервисом.</p><form class="form" id="addForm"><input class="field" id="name" autocomplete="off" placeholder="Название, например GitHub"><input class="field secret" id="secret" type="password" autocomplete="off" spellcheck="false" placeholder="Base32 или otpauth://"><button class="add">Добавить</button></form><div class="status" id="status"></div></section><section class="list" id="list"></section><div class="footer">Ключи хранятся только в localStorage этого браузера и не отправляются на сервер.</div></main></div><div class="toast" id="toast">Скопировано</div>
<script>(()=>{
const $=id=>document.getElementById(id),list=$('list'),status=$('status'),form=$('addForm'),nameInput=$('name'),secretInput=$('secret'),toast=$('toast');
const STORE='twofa_accounts_v1',defaults={period:30,digits:6,algorithm:'SHA1'};let accounts=load();
function load(){try{const v=JSON.parse(localStorage.getItem(STORE)||'[]');return Array.isArray(v)?v:[]}catch{return[]}}
function save(){localStorage.setItem(STORE,JSON.stringify(accounts))}
function msg(t='',e=false){status.textContent=t;status.classList.toggle('error',e)}
function pop(t){toast.textContent=t;toast.classList.add('show');clearTimeout(pop.t);pop.t=setTimeout(()=>toast.classList.remove('show'),1300)}
function clean(s){return s.replace(/\s+/g,'').replace(/-/g,'').replace(/=+$/g,'').toUpperCase()}
function parse(raw){raw=raw.trim();if(!raw)throw Error('Введите секретный ключ');let c={...defaults,secret:''};if(raw.toLowerCase().startsWith('otpauth://')){let u;try{u=new URL(raw)}catch{throw Error('Некорректная otpauth-ссылка')}const s=u.searchParams.get('secret');if(!s)throw Error('В ссылке нет secret');c.secret=clean(s);const p=Number(u.searchParams.get('period')),d=Number(u.searchParams.get('digits')),a=(u.searchParams.get('algorithm')||'SHA1').toUpperCase().replace(/-/g,'');if(Number.isFinite(p)&&p>=5&&p<=300)c.period=Math.floor(p);if([6,7,8].includes(d))c.digits=d;if(['SHA1','SHA256','SHA512'].includes(a))c.algorithm=a;if(!nameInput.value.trim())nameInput.value=decodeURIComponent(u.pathname.replace(/^\//,''))||u.searchParams.get('issuer')||''}else c.secret=clean(raw);if(!/^[A-Z2-7]+$/.test(c.secret))throw Error('Ключ должен быть Base32');return c}
function base32ToBytes(base32){const alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';let bits='';for(const ch of base32){const v=alphabet.indexOf(ch);if(v<0)throw Error('Некорректный Base32-ключ');bits+=v.toString(2).padStart(5,'0')}const out=[];for(let i=0;i+8<=bits.length;i+=8)out.push(parseInt(bits.slice(i,i+8),2));if(!out.length)throw Error('Слишком короткий ключ');return new Uint8Array(out)}
function counterBytes(counter){const b=new ArrayBuffer(8),v=new DataView(b),high=Math.floor(counter/0x100000000),low=counter>>>0;v.setUint32(0,high,false);v.setUint32(4,low,false);return new Uint8Array(b)}
function rol(n,b){return(n<<b)|(n>>>(32-b))}
function sha1(bytes){const ml=bytes.length*8,l=((bytes.length+9+63)>>6)<<6,m=new Uint8Array(l);m.set(bytes);m[bytes.length]=0x80;for(let i=0;i<8;i++)m[l-1-i]=(ml>>> (i*8))&255;const dv=new DataView(m.buffer);let h0=0x67452301,h1=0xefcdab89,h2=0x98badcfe,h3=0x10325476,h4=0xc3d2e1f0,w=new Int32Array(80);for(let off=0;off<l;off+=64){for(let i=0;i<16;i++)w[i]=dv.getInt32(off+i*4,false);for(let i=16;i<80;i++)w[i]=rol(w[i-3]^w[i-8]^w[i-14]^w[i-16],1);let a=h0,b=h1,c=h2,d=h3,e=h4;for(let i=0;i<80;i++){let f,k;if(i<20){f=(b&c)|((~b)&d);k=0x5a827999}else if(i<40){f=b^c^d;k=0x6ed9eba1}else if(i<60){f=(b&c)|(b&d)|(c&d);k=0x8f1bbcdc}else{f=b^c^d;k=0xca62c1d6}const t=(rol(a,5)+f+e+k+w[i])|0;e=d;d=c;c=rol(b,30);b=a;a=t}h0=(h0+a)|0;h1=(h1+b)|0;h2=(h2+c)|0;h3=(h3+d)|0;h4=(h4+e)|0}const out=new Uint8Array(20),od=new DataView(out.buffer);od.setInt32(0,h0,false);od.setInt32(4,h1,false);od.setInt32(8,h2,false);od.setInt32(12,h3,false);od.setInt32(16,h4,false);return out}
function hmacSha1(key,msgBytes){if(key.length>64)key=sha1(key);const k=new Uint8Array(64);k.set(key);const ipad=new Uint8Array(64),opad=new Uint8Array(64);for(let i=0;i<64;i++){ipad[i]=k[i]^0x36;opad[i]=k[i]^0x5c}const inner=new Uint8Array(64+msgBytes.length);inner.set(ipad);inner.set(msgBytes,64);const ih=sha1(inner),outer=new Uint8Array(84);outer.set(opad);outer.set(ih,64);return sha1(outer)}
async function totp(cfg,counter){const algo=(cfg.algorithm||'SHA1').toUpperCase();let sig;if(globalThis.crypto&&crypto.subtle){const hashName={SHA1:'SHA-1',SHA256:'SHA-256',SHA512:'SHA-512'}[algo];const key=await crypto.subtle.importKey('raw',base32ToBytes(cfg.secret),{name:'HMAC',hash:hashName},false,['sign']);sig=new Uint8Array(await crypto.subtle.sign('HMAC',key,counterBytes(counter)))}else{if(algo!=='SHA1')throw Error('Для '+algo+' требуется HTTPS');sig=hmacSha1(base32ToBytes(cfg.secret),counterBytes(counter))}const offset=sig[sig.length-1]&15;const bin=((sig[offset]&127)<<24)|((sig[offset+1]&255)<<16)|((sig[offset+2]&255)<<8)|(sig[offset+3]&255);const digits=Number(cfg.digits)||6;return String((bin>>>0)%(10**digits)).padStart(digits,'0')}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){if(!accounts.length){list.innerHTML='<div class="empty">Пока нет сохранённых ключей.</div>';return}list.innerHTML=accounts.map((a,i)=>`<article class="account" data-i="${i}"><div><div class="account-name">${esc(a.name||'Без названия')}</div><div class="account-meta">${a.period||30} сек · ${a.digits||6} цифр · ${(a.algorithm||'SHA1').replace('SHA','SHA-')}</div><div class="code" data-code>------</div><div class="timer"><span data-time>—</span><div class="bar"><i data-bar></i></div></div></div><div class="actions"><button class="icon-btn" data-copy title="Копировать"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="11" height="11" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg></button><button class="icon-btn" data-remove title="Удалить"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 10v6M14 10v6"/></svg></button></div></article>`).join('')}
async function tick(){const now=Math.floor(Date.now()/1000);for(const el of list.querySelectorAll('.account')){const a=accounts[+el.dataset.i];if(!a)continue;const period=Number(a.period)||30,remaining=period-(now%period),counter=Math.floor(now/period),codeEl=el.querySelector('[data-code]');try{const code=await totp(a,counter);codeEl.textContent=code;codeEl.style.color='#111';el.dataset.code=code;el.querySelector('[data-time]').textContent=remaining+' сек';el.querySelector('[data-bar]').style.width=(remaining/period*100)+'%'}catch(err){codeEl.textContent=err.message||'Не удалось создать код';codeEl.style.fontSize='16px';codeEl.style.letterSpacing='0';codeEl.style.color='#ef4444'}}}
form.addEventListener('submit',e=>{e.preventDefault();msg();try{const c=parse(secretInput.value),name=nameInput.value.trim()||`Аккаунт ${accounts.length+1}`;accounts.push({name,...c});save();nameInput.value='';secretInput.value='';render();tick();pop('Ключ сохранён')}catch(e){msg(e.message||'Ошибка',true)}});
list.addEventListener('click',async e=>{const el=e.target.closest('.account');if(!el)return;const i=+el.dataset.i;if(e.target.closest('[data-remove]')){accounts.splice(i,1);save();render();tick();pop('Ключ удалён')}else if(e.target.closest('[data-copy]')&&el.dataset.code){try{await navigator.clipboard.writeText(el.dataset.code);pop('Код скопирован')}catch{pop('Не удалось скопировать')}}});
render();tick();setInterval(tick,1000);
})();</script></body></html>
